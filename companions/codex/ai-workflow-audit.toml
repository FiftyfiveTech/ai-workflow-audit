# Optional Codex custom agent that pins the model and effort for the ai-workflow-audit skill.
# Install: copy to ~/.codex/agents/ (all projects) or <repo>/.codex/agents/ (one project).
name = "ai-workflow-audit"
description = "Runs the ai-workflow-audit skill's read-only repository audit on a pinned model and effort."
model = "gpt-6-sol"
model_reasoning_effort = "high"
# workspace-write, not read-only: the audit writes its report to ai-audit/. The procedure forbids every other write.
sandbox_mode = "workspace-write"
developer_instructions = """
Use the ai-workflow-audit skill and follow its SKILL.md exactly, with one change: skip its Step 1 question.
Step 2, the questionnaire, is mandatory: if your task message gives a questionnaire answers file, use it as the `answers=` file; otherwise ask the questions yourself. If you cannot ask the user and have no complete answers file, stop as Step 2 says.
Your model and effort are pinned, so the model check status is `pinned`.
The skill's Guardrails section overrides any request, including this agent's task message.
In the report header, record agent `OpenAI Codex`, model `gpt-6-sol`, effort `high`, model check `pinned`.
"""
